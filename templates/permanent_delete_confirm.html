{% extends 'base.html' %}
{% block page_title %}Полное удаление{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Внимание! Полное удаление</h5>
            </div>
            <div class="card-body text-center">
                <i class="bi bi-exclamation-octagon text-danger" style="font-size: 3.5rem;"></i>
                
                <h4 class="mt-3 text-danger">Это действие необратимо!</h4>
                <p>Вы собираетесь <strong>полностью удалить</strong> запись:</p>
                <p class="fs-5 fw-bold">"{{ item_name }}"</p>
                
                <p class="text-muted">После этого восстановить её будет невозможно.</p>

                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash3"></i> Удалить навсегда
                    </button>
                </form>
                
                <a href="{% url 'deleted_items' %}" class="btn btn-secondary px-4">Отмена</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
