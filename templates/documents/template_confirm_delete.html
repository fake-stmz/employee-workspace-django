{% extends 'base.html' %}
{% block page_title %}Удаление шаблона{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">
        <i class="bi bi-exclamation-triangle me-2"></i>Подтверждение удаления
      </div>
      <div class="card-body text-center py-4">
        <i class="bi bi-file-earmark-x text-danger" style="font-size:3rem;"></i>
        <p class="mt-3 mb-1">Вы действительно хотите удалить шаблон:</p>
        <p class="fs-5 fw-bold">«{{ tpl.title }}»</p>
        <p class="text-muted small">Это действие необратимо.</p>
      </div>
      <div class="card-footer d-flex gap-2 justify-content-end">
        <a href="{% url 'template_list' %}" class="btn btn-secondary">Отмена</a>
        <form method="post" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>Удалить
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
