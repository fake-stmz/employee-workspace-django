<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tpl.title }}</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Times New Roman", Times, serif;
      font-size: 12pt;
      color: #000;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    /* Screen: показываем управляющую панель и лист-тень */
    .print-toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      background: #212529;
      color: #fff;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .print-toolbar a, .print-toolbar button {
      font-family: -apple-system, sans-serif;
      font-size: 0.85rem;
    }
    .print-toolbar .title {
      font-family: -apple-system, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-wrap {
      margin-top: 60px;
      padding: 32px 24px 48px;
      display: flex;
      justify-content: center;
    }

    .document-page {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      padding: 25mm 20mm;
      box-shadow: 0 4px 30px rgba(0,0,0,0.15);
      border-radius: 2px;
      line-height: 1.8;
    }

    /* Print media */
    @media print {
      body { background: #fff; }
      .print-toolbar { display: none !important; }
      .page-wrap { margin: 0; padding: 0; }
      .document-page {
        width: 100%;
        min-height: auto;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
      }
    }

    /* Document styling */
    .document-page h1, .document-page h2, .document-page h3 { margin-top: 1em; }
    .document-page p { margin: 0.5em 0; }
    .document-page table { width: 100%; border-collapse: collapse; margin: 1em 0; }
    .document-page td, .document-page th {
      border: 1px solid #999;
      padding: 4px 8px;
    }
    .document-page hr { border-top: 1px solid #999; margin: 1em 0; }
  </style>
</head>
<body>

<!-- Toolbar (hidden on print) -->
<div class="print-toolbar">
  <span class="title"><i>📄</i> {{ tpl.title }}</span>
  <button onclick="window.print()"
          style="background:#2ecc71;color:#fff;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-weight:600;">
    🖨 Печать
  </button>
  <a href="{% url 'template_fill' tpl.pk %}"
     style="color:#adb5bd;text-decoration:none;padding:7px 14px;border:1px solid #495057;border-radius:6px;">
    ← Назад
  </a>
  <a href="{% url 'template_list' %}"
     style="color:#adb5bd;text-decoration:none;padding:7px 14px;">
    Все шаблоны
  </a>
</div>

<!-- A4 page -->
<div class="page-wrap">
  <div class="document-page">
    {{ filled_body }}
  </div>
</div>

<script>
  // Auto-trigger print dialog after page loads
  window.addEventListener('load', function() {
    setTimeout(function() { window.print(); }, 400);
  });
</script>

</body>
</html>
