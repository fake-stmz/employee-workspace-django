<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Employee Workspace</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .login-header {
            background: #212529;
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
        }
        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="login-card bg-white">
    <div class="login-header">
        <div class="mb-3">
            <i class="bi bi-briefcase-fill" style="font-size: 2.5rem;"></i>
        </div>
        <h3 class="mb-0">Employee Workspace</h3>
        <p class="text-white-50 mb-0">Войдите в систему</p>
    </div>

    <div class="card-body p-5">
        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                Неправильное имя пользователя или пароль.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label fw-medium">Имя пользователя</label>
                <input type="text" 
                       name="username" 
                       class="form-control"
                       placeholder="Введите имя пользователя"
                       required>
            </div>

            <div class="mb-4">
                <label class="form-label fw-medium">Пароль</label>
                <input type="password" 
                       name="password" 
                       class="form-control"
                       placeholder="Введите пароль"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Войти
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
