{% extends 'base.html' %}
{% block page_title %}{{ page.title }}{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0">{{ page.title }}</h4>
        <div>
            <a href="{% url 'wiki_update' page.pk %}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil"></i> Редактировать
            </a>
            <a href="{% url 'wiki_delete' page.pk %}" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-trash"></i> Удалить
            </a>
        </div>
    </div>
    <div class="card-body">
        <div class="content">
            {{ page.content|linebreaks }}
        </div>
    </div>
    <div class="card-footer text-muted small">
        Автор: {{ page.author|default:"—" }} • 
        Создано: {{ page.created_at|date:"d.m.Y в H:i" }}
    </div>
</div>

<a href="{% url 'wiki_list' %}" class="btn btn-secondary mt-3">
    ← Назад к списку
</a>

{% endblock %}
