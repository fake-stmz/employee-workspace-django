{% extends 'base.html' %}
{% block page_title %}Вики{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-book"></i> База знаний (Вики)</h2>
    <a href="{% url 'wiki_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Новая страница
    </a>
</div>

<!-- Поиск -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-7">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" 
                           id="searchInput" 
                           class="form-control" 
                           placeholder="Поиск по названию или содержанию...">
                </div>
            </div>
            <div class="col-md-3">
                <button id="resetFilters" class="btn btn-outline-secondary w-100">Сбросить</button>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0" id="wikiTable">
            <thead class="table-light">
                <tr>
                    <th>Название</th>
                    <th>Автор</th>
                    <th>Создано</th>
                    <th class="text-end">Действия</th>
                </tr>
            </thead>
            <tbody id="wikiTableBody"></tbody>
        </table>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const resetBtn = document.getElementById('resetFilters');
    const tableBody = document.getElementById('wikiTableBody');

    let debounceTimer;

    function loadWiki(search = '') {
        let url = `/api/wiki/?format=json`;
        if (search) url += `&search=${encodeURIComponent(search)}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="bi bi-search"></i><br>Ничего не найдено
                            </td>
                        </tr>`;
                    return;
                }

                data.forEach(page => {
                    const row = `
                        <tr>
                            <td>
                                <a href="/wiki/${page.id}/" class="text-decoration-none">
                                    <strong>${page.title}</strong>
                                </a>
                            </td>
                            <td>${page.author ? page.author.full_name : '—'}</td>
                            <td>${new Date(page.created_at).toLocaleDateString('ru-RU')}</td>
                            <td class="text-end">
                                <a href="/wiki/${page.id}/edit/" class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button onclick="showDeleteModal('/wiki/${page.id}/delete/', 'Страницу «${page.title}»')" 
                                        class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(err => console.error(err));
    }

    // Live search
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            loadWiki(searchInput.value);
        }, 300);
    });

    resetBtn.addEventListener('click', () => {
        searchInput.value = '';
        loadWiki();
    });

    // Initial load
    loadWiki();
});
</script>
{% endblock %}
