{% extends 'base.html' %}
{% block page_title %}Удаление страницы{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body text-center py-5">
                <i class="bi bi-trash3 text-danger" style="font-size: 3.5rem;"></i>
                <h4 class="mt-3">Удалить страницу?</h4>
                <p class="lead">"{{ page.title }}"</p>
                
                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-5">Да, удалить</button>
                </form>
                <a href="{% url 'wiki_list' %}" class="btn btn-secondary px-5">Отмена</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
