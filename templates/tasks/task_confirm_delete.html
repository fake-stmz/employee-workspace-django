{% extends 'base.html' %}
{% block page_title %}Удаление задачи{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body text-center">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <h4 class="mt-3">Вы уверены?</h4>
                <p class="text-muted">
                    Задача <strong>"{{ task.title }}"</strong> будет удалена без возможности восстановления.
                </p>

                <form method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                </form>
                <a href="{% url 'task_list' %}" class="btn btn-secondary px-4">Отмена</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
