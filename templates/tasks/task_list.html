{% extends 'base.html' %}
{% block page_title %}Задачи{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-check2-square"></i> Задачи</h2>
    <a href="{% url 'task_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Новая задача
    </a>
</div>

<!-- Панель поиска и фильтров -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" 
                           id="searchInput" 
                           class="form-control" 
                           placeholder="Поиск по названию задачи...">
                </div>
            </div>
            <div class="col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">Все статусы</option>
                    <option value="new">Новое</option>
                    <option value="progress">В процессе</option>
                    <option value="done">Выполнено</option>
                </select>
            </div>
            <div class="col-md-3">
                <button id="resetFilters" class="btn btn-outline-secondary w-100">
                    Сбросить
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Таблица задач -->
<div id="tasksTableContainer">
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="tasksTable">
                <thead class="table-light">
                    <tr>
                        <th>Название</th>
                        <th>Статус</th>
                        <th>Ответственный</th>
                        <th>Срок</th>
                        <th>Создано</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody id="tasksTableBody">
                    <!-- Заполняется через JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const resetBtn = document.getElementById('resetFilters');
    const tableBody = document.getElementById('tasksTableBody');

    let debounceTimer;

    function loadTasks(search = '', status = '') {
        let url = `/api/tasks/?format=json`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (status) url += `&status=${status}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-search" style="font-size: 2rem;"></i><br>
                                Ничего не найдено
                            </td>
                        </tr>`;
                    return;
                }

                data.forEach(task => {
                    const statusBadge = task.status === 'new' ? 'bg-primary' : 
                                       task.status === 'progress' ? 'bg-warning text-dark' : 'bg-success';

                    const assignedName = task.assigned_to ? task.assigned_to.full_name : '—';
                    const dueDate = task.due_date ? new Date(task.due_date).toLocaleDateString('ru-RU') : '—';
                    const createdAt = task.created_at ? new Date(task.created_at).toLocaleDateString('ru-RU') : '—';

                    const row = `
                        <tr>
                            <td>
                                <a href="/tasks/${task.id}/" class="text-decoration-none fw-bold">
                                    ${task.title}
                                </a>
                            </td>
                            <td>
                                <span class="badge ${statusBadge} d-inline-flex align-items-center justify-content-center py-1" 
                                    style="min-height: 24px;">
                                    ${task.get_status_display || task.status}
                                </span>
                            </td>
                            <td>${assignedName}</td>
                            <td>${dueDate}</td>
                            <td>${createdAt}</td>
                            <td class="text-end">
                                <a href="/tasks/${task.id}/" class="btn btn-sm btn-outline-info me-1">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a href="/tasks/${task.id}/edit/" class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a href="/tasks/${task.id}/delete/" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error:', error));
    }

    // Debounce + обработчики
    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => loadTasks(searchInput.value, statusFilter.value), 300);
    });

    statusFilter.addEventListener('change', () => loadTasks(searchInput.value, statusFilter.value));

    resetBtn.addEventListener('click', () => {
        searchInput.value = '';
        statusFilter.value = '';
        loadTasks();
    });

    // Первая загрузка
    loadTasks();
});
</script>
{% endblock %}
